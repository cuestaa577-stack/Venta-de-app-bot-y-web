# Render Blueprint — Nexo Digital (sitio estático)
# Al conectar este repositorio en Render, detectará este archivo automáticamente.
services:
  - type: web
    name: nexo-digital
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
