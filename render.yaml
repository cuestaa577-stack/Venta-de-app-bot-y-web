# Render Blueprint — Nexo Digital (sitio estático multi-página)
# Al conectar este repositorio en Render, detectará este archivo automáticamente.
services:
  - type: web
    name: nexo-digital
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
